spring:
  application:
    name: erp-project

  profiles:
    active: dev # dev / prod - çalışma ortamına göre değiştirilir

  jpa:
    hibernate:
      ddl-auto: validate # Şema değişiklikleri Flyway ile yönetilir, Hibernate şemayı SADECE doğrular
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# JWT ayarları
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENV_VARIABLE_MIN_256_BIT}
    expiration-ms: 86400000 # 24 saat

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    root: INFO
    com.erp: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
